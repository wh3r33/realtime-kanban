<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - realtime-kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="forgot-password">
    <main class="auth-shell centered">
      <form class="form-card glass reveal">
        <a class="brand-mark compact" href="../index.html">realtime-kanban</a>
        <div class="empty-state auth-empty">Reset</div>
        <h1>Send a reset link</h1>
        <p class="form-note">Enter the email attached to your workspace. We will send a quiet recovery link.</p>
        <label>Email<input class="input" type="email" placeholder="nn.user@example.com" /></label>
        <button class="button primary" type="button">Send reset link</button>
        <a href="login.html">Back to login</a>
      </form>
    </main>
    <div id="toastStack" class="toast-stack"></div>
    <script src="../script.js"></script>
  </body>
</html>
