<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board - realtime-kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="board">
    <section class="workspace-screen standalone active">
      <div class="workspace-noise"></div>
      <header class="topbar glass">
        <div class="presence-cluster"><span class="online-signal"></span><span>4 online</span><div class="mini-avatars" id="miniAvatars"></div></div>
        <nav class="nav-capsule" data-nav><a href="boards.html">Boards</a><a href="board.html">Board</a><a href="activity.html">Activity</a><a href="members.html">Members</a><a href="settings.html">Settings</a></nav>
        <div class="top-actions"><button class="ghost-button" data-open-invite type="button">Invite</button><a class="icon-button" href="../bonus/notifications.html" aria-label="Notifications"><span class="notification-dot"></span></a><a class="profile-button" href="profile.html">NN</a></div>
      </header>
      <aside class="activity-rail glass"><div class="rail-section"><p class="rail-label">Editing Now</p><div id="editingNow" class="editing-now"></div></div><div class="rail-section"><p class="rail-label">Recent Activity</p><div id="activityFeed" class="activity-feed"></div></div></aside>
      <div class="workspace-shell">
        <section class="board-hero"><div><p class="kicker">realtime-kanban Board</p><h2>Collaboration, visible by default.</h2></div><div class="board-meta"><span class="status-badge live">LIVE</span><span class="status-badge online">ONLINE</span><span id="lastChanged">Last change just now</span></div></section>
        <section class="board-layout" id="board"></section>
      </div>
      <aside id="taskDrawer" class="task-drawer glass" aria-hidden="true"><div class="drawer-header"><div><p class="kicker">Task Detail</p><h3 id="drawerTitle">Select a task</h3></div><button id="closeDrawer" class="icon-button" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg></button></div><div id="drawerContent" class="drawer-content"></div></aside>
    </section>
    <div id="toastStack" class="toast-stack"></div>
    <div id="modalRoot"></div>
    <script src="../script.js"></script>
  </body>
</html>
