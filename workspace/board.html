<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board - realtime-kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="board" data-route="/boards/:boardId">
    <!-- Future Vue route: /boards/:boardId -->
    <section class="workspace-screen standalone active">
      <div class="workspace-noise"></div>
      <!-- Future Vue component: TopBar -->
      <header class="topbar glass" data-component="TopBar">
        <div class="presence-cluster" data-component="PresenceCluster"><span class="online-signal"></span><span>4 online</span><div class="mini-avatars" id="miniAvatars"></div></div>
        <nav class="nav-capsule" data-nav><a href="boards.html">Boards</a><a href="board.html" data-board-route="board">Board</a><a href="activity.html" data-board-route="activity">Activity</a><a href="members.html" data-board-route="members">Members</a><a href="settings.html" data-board-route="settings">Settings</a></nav>
        <div class="top-actions"><button class="ghost-button" data-undo-action type="button">Undo</button><button class="ghost-button" data-redo-action type="button">Redo</button><button class="ghost-button" data-open-invite type="button">Invite</button><a class="icon-button" href="../bonus/notifications.html" aria-label="Notifications"><span class="notification-dot"></span></a><a class="profile-button" href="profile.html">NN</a></div>
      </header>
      <!-- Future Vue component: ActivityRail -->
      <aside class="activity-rail glass" data-component="ActivityRail"><div class="rail-section"><p class="rail-label">Editing Now</p><div id="editingNow" class="editing-now"></div></div><div class="rail-section"><p class="rail-label">Recent Activity</p><div id="activityFeed" class="activity-feed"></div></div></aside>
      <div class="workspace-shell">
        <section class="board-hero" data-component="BoardHeader"><div><p class="kicker" data-selected-board-label>realtime-kanban Board</p><h2 data-selected-board-title>Collaboration, visible by default.</h2></div><div class="board-meta"><span class="status-badge live" data-sync-state>LIVE</span><span class="status-badge online">ONLINE</span><span id="lastChanged">Last change just now</span></div></section>
        <!-- Future Vue component: BoardColumn list -->
        <section class="board-layout" id="board" data-component="Board"></section>
      </div>
      <!-- Future Vue component: TaskDrawer -->
      <aside id="taskDrawer" class="task-drawer glass" data-component="TaskDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true"><div class="drawer-header"><div><p class="kicker">Task Detail</p><h3 id="drawerTitle">Select a task</h3></div><button id="closeDrawer" class="icon-button" type="button" aria-label="Close task drawer"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg></button></div><div id="drawerContent" class="drawer-content"></div></aside>
    </section>
    <div id="toastStack" class="toast-stack"></div>
    <div id="modalRoot"></div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
