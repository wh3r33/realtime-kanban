<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Offline Center - realtime-kanban</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="../styles.css" /></head>
  <body data-page="offline" data-route="/bonus/offline">
    <!-- Future Vue route: /bonus/offline -->
    <main class="app-shell"><div class="workspace-noise"></div><header class="glass-topbar"><a class="brand-mark compact" href="../index.html">realtime-kanban</a><nav class="nav-capsule" data-nav><a href="../workspace/boards.html">Boards</a><a href="notifications.html">Notifications</a><a href="offline.html">Offline</a></nav><a class="profile-button" href="../workspace/profile.html">NN</a></header>
      <section class="page-header reveal"><p class="kicker">Offline Center</p><h1>Local changes stay visible until sync returns.</h1></section>
      <section class="page-grid two-col reveal"><div class="panel glass" data-component="SyncStatus"><span class="status-badge conflict" id="connectionBadge">OFFLINE</span><h2>Connection status</h2><p data-offline-summary>Three changes are waiting in the local queue.</p><div class="inline-actions"><button class="button secondary" id="simulateOffline" type="button">Simulate offline</button><button class="button primary" id="retrySync" type="button">Retry sync</button></div></div><div class="panel glass"><h2>Conflict after reconnect</h2><p>Card order changed remotely while Guest User edited locally.</p><button class="button secondary" data-conflict-demo type="button">Resolve conflict</button></div></section>
      <section class="panel glass reveal" data-component="OfflineQueue"><h2>Pending changes queue</h2><div class="compact-list" id="offlineQueue"></div></section>
    </main><div id="modalRoot"></div><div id="toastStack" class="toast-stack"></div><script src="../script.js"></script>
  </body>
</html>
