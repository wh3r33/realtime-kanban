<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accept Invitation - realtime-kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="accept-invitation" data-route="/auth/invitations/:token">
    <!-- Future Vue route: /auth/invitations/:token -->
    <main class="auth-shell centered">
      <section class="form-card glass invite-card reveal">
        <a class="brand-mark compact" href="../index.html">realtime-kanban</a>
        <p class="kicker">Workspace Invite</p>
        <h1>Join realtime-kanban Board</h1>
        <div class="invite-preview">
          <div><span>Inviter</span><strong>NN User</strong></div>
          <div><span>Role</span><strong>Editor</strong></div>
          <div><span>Access</span><strong>Cards, comments, movement</strong></div>
        </div>
        <a class="button primary" href="../workspace/board.html" data-accept-invitation>Accept invitation</a>
        <a href="../index.html">Decline invitation</a>
      </section>
    </main>
    <div id="toastStack" class="toast-stack"></div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
