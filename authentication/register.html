<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - realtime-kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body data-page="register">
    <main class="auth-shell">
      <section class="brand-pane reveal">
        <a class="brand-mark" href="../index.html">realtime-kanban</a>
        <h1 class="auth-title">Create a shared workspace that shows its live state.</h1>
        <div class="benefit-list">
          <span>Realtime sync</span><span>Conflict-safe editing</span><span>Team presence</span>
        </div>
      </section>
      <form class="form-card glass reveal">
        <p class="kicker">Create Account</p>
        <label>Name<input class="input" type="text" placeholder="NN User" /></label>
        <label>Email<input class="input" type="email" placeholder="nn.user@example.com" /></label>
        <label>Password<input class="input" type="password" placeholder="Create password" /></label>
        <button class="button primary" type="button">Create account</button>
        <p class="form-note">Already onboarded? <a href="login.html">Log in</a></p>
      </form>
    </main>
    <div id="toastStack" class="toast-stack"></div>
    <script src="../script.js"></script>
  </body>
</html>
